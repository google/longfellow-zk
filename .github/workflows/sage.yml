name: Test Sage implementation
permissions: {}

on:
  push:
    branches:
    - main
  pull_request:

permissions:
  contents: read

jobs:
  sage:
    name: Test Sage
    runs-on: ubuntu-latest
    container:
      image: sagemath/sagemath:10.8@sha256:e2e4747b0e1ea8753a9cb5a399314a8b2c25fcefaf69ba85b22ee075829d09ea
      options: --user root
    steps:
    - name: Install dependencies
      run: sage --pip install pycryptodome mypy
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Run tests
      working-directory: docs/specs/sage
      run: |
        sage --python -m mypy *.py tests/*.py
        sage --python -m unittest --verbose
